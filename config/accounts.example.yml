# ══════════════════════════════════════════════════════
#  Finance OS — Family Account Configuration
#  Copy to: config/accounts.yml  (git-ignored for privacy)
# ══════════════════════════════════════════════════════

# ── Email accounts (passwords are resolved from .env) ──
email_accounts:
  - owner_id:    "user"
    owner_name:  "Your Name"
    address:     "${USER_GMAIL}"
    app_password: "${USER_GMAIL_APP_PASSWORD}"
    imap_host:   "imap.gmail.com"
    imap_port:   993

  - owner_id:    "user"
    owner_name:  "Your Name"
    address:     "${USER_YAHOO}"
    app_password: "${USER_YAHOO_APP_PASSWORD}"
    imap_host:   "imap.mail.yahoo.com"
    imap_port:   993

  - owner_id:    "wife"
    owner_name:  "Wife's Name"
    address:     "${WIFE_GMAIL}"
    app_password: "${WIFE_GMAIL_APP_PASSWORD}"
    imap_host:   "imap.gmail.com"
    imap_port:   993

  - owner_id:    "wife"
    owner_name:  "Wife's Name"
    address:     "${WIFE_YAHOO}"
    app_password: "${WIFE_YAHOO_APP_PASSWORD}"
    imap_host:   "imap.mail.yahoo.com"
    imap_port:   993

# ── Owners ─────────────────────────────────────────────
# Personal info is used to DERIVE PDF passwords automatically at runtime.
# Passwords are never stored — computed from dob + pan per institution.
#   HDFC        → name[:4].upper() + DDMM           e.g. SWET1503
#   SBI         → name[:4].upper() + DDMMYYYY       e.g. SWET15031990
#   Axis        → name[:4].upper() + DDMMYYYY       e.g. SWET15031990
#   Union Bank  → name[:4].upper() + DDMM           e.g. SWET1503
#   Zerodha     → PAN uppercase                     e.g. ABCDE1234F
#   CAMS / KFin → PAN uppercase                     e.g. ABCDE1234F
#   CDSL        → PAN uppercase                     e.g. ABCDE1234F
owners:
  - id:     "user"
    name:   "Your Name"
    dob:    ""           # YYYY-MM-DD  e.g. 1990-03-15
    pan:    ""           # PAN uppercase  e.g. ABCDE1234F
    mobile: ""           # 10-digit mobile (last 4 used as SBI fallback)
    # ── Tax profile (drives 80C dead-weight ELSS detection) ──
    # All fields below are seeded into the DB on first start, then
    # become UI-editable via the Profile button on the Goals tab.
    tax_regime:           "old"   # "old" | "new" — 80C only checked under "old"
    epf_monthly:          0       # employee EPF contribution per month (₹)
    home_loan_share_pct:  0       # co-borrower share of household home loan (0-100).
                                  #   Multiple co-borrowers: each owner's share counts
                                  #   for their 80C; sum < 100 implies an external
                                  #   co-borrower (e.g. parent) whose share isn't tracked.
    # ── Employer salary keywords (recommended — no regex knowledge needed) ──
    # Add your employer's name as it appears in your bank's NEFT narration.
    # Only needed if the word "salary" doesn't appear in the bank narration —
    # most HDFC/SBI narrations already contain "SAL" so this can stay empty.
    # Check by searching a month of transactions for your salary credit.
    # Examples: "acmecorp", "acme technologies", "abc pvt ltd"
    salary_keywords: []

    # ── Advanced: full regex (optional, for power users) ─────────────────
    # Leave this empty — salary_keywords above is easier and covers most cases.
    salary_patterns: []

  - id:     "wife"
    name:   "Wife's Name"
    dob:    ""
    pan:    ""
    mobile: ""
    tax_regime:           "old"
    epf_monthly:          0
    home_loan_share_pct:  0
    salary_keywords: []
    salary_patterns: []

# ── Children (used to compute age-based goal target dates) ────────────
# Goals of type child_education / child_marriage use the OLDEST child's
# DOB + milestone age. List one entry per child. Leave the block out
# entirely if you have no children — child goals will use their stored
# target_date as a fallback.
children:
  - id:            "child1"
    name:          "Child Name"
    dob:           "2020-04-15"     # YYYY-MM-DD
    education_age: 18                # higher education starts at age 18
    marriage_age:  25                # marriage planning at age 25
  # Add more children below as needed (oldest drives the milestone)

# Inflation is NOT set per goal: one automatic app-wide rate (10-year average India CPI), see ADR-0019.
# ── Goals (seeded into DB on first startup) ────────────
# Adjust amounts and dates to match your family situation.
# target_amount is in TODAY'S money — inflation adjustment is automatic.
# For child_education / child_marriage / retirement goals the target_date
# below is overridden by the age-based date derived from `children` /
# `owners[].birth_date + retirement_age` when those are set.
goals:
  - owner_id:             "family"
    name:                 "Child Higher Education"
    goal_type:            "child_education"
    target_amount:        5000000        # ₹50 lakhs in today's value
    target_date:          "2040-06-01"
    expected_return_rate: 12.0           # % annual returns on investments
    notes:                "Engineering / Medical / MBA fund"

  - owner_id:             "family"
    name:                 "Child Marriage"
    goal_type:            "child_marriage"
    target_amount:        3000000        # ₹30 lakhs in today's value
    target_date:          "2047-01-01"
    expected_return_rate: 10.0

  - owner_id:             "user"
    name:                 "Your Retirement"
    goal_type:            "retirement"
    target_amount:        50000000       # ₹5 crore — sustains 25 years @ 4% withdrawal
    target_date:          "2050-01-01"
    expected_return_rate: 12.0
    notes:                "Target: retire at 60, corpus to last till 85"

  - owner_id:             "wife"
    name:                 "Wife's Retirement"
    goal_type:            "retirement"
    target_amount:        30000000       # ₹3 crore
    target_date:          "2052-01-01"
    expected_return_rate: 12.0

  - owner_id:             "family"
    name:                 "Emergency Fund"
    goal_type:            "emergency"
    target_amount:        600000         # 6× monthly expenses — update after first sync
    target_date:          "2025-12-31"
    expected_return_rate: 6.5            # liquid MF / savings account
    notes:                "Keep in liquid mutual fund or FD with instant redemption"

  - owner_id:             "family"
    name:                 "Health & Senior Care Fund"
    goal_type:            "health"
    target_amount:        2000000        # ₹20 lakhs
    target_date:          "2040-01-01"
    expected_return_rate: 8.0
    notes:                "Covers parents' senior care + major medical events"

# Family members whose money moves in or out of the household accounts (parents etc.): labelled transfer / family, never income or spending.
family_names: []
#  - "Parent Full Name"

# ── Optional blocks the planner reads (all private, all optional) ───────────────────────────────────────────────────────────────────────
# epf:                      # EPFO balance on a date and this month's contribution; rolled forward at the declared rate
#   - {owner: user, as_of: 2026-01-31, balance: 0, employee_monthly: 0, employer_monthly: 0}
# income:                   # current CTC, for the tax slab (bank credits are after TDS and EPF)
#   user: {ctc_annual: 0, from: 2026-01-01, employer: ""}
# family_history:           # ancestors only: died_at / alive_at ages; nudges the planning horizon a little (heritability of lifespan is about 25%)
#   user: [{relation: grandfather, died_at: 85}]
# term_insurance:           # return-of-premium plan: premium_term_years, the age the total is paid back, and the amount
#   - {owner: user, premium_term_years: 12, final_premium_date: 2036-09-16, maturity_date: 2064-10-16, return_age: 72, return_amount: 0}   # dates optional
# goal_priority: [emergency, child_education, retirement, health, child_marriage]   # funding order; default is by date


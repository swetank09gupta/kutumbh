# Income-tax slabs per financial year and regime, for individuals below 60. Public facts, each read at a source on `verified_on`.
# slabs: [[upper bound of the band, rate %], ...]; the last band has no upper bound (null).
# rebate: s.87A - tax is rebated up to `max` when taxable income does not exceed `limit` (not against special-rate capital gains).
# Budget 2026 (Feb 2026) changed no slab, rate, standard deduction or rebate, so FY 2026-27 repeats FY 2025-26.
# Add the next year here when its Budget is read; the consistency check warns when the current year has no entry.
years:
  - fy: 2024-25
    new:
      standard_deduction: 75000
      rebate: {limit: 700000, max: 25000}
      slabs: [[300000, 0], [700000, 5], [1000000, 10], [1200000, 15], [1500000, 20], [null, 30]]
      source: https://www.businesstoday.in/amp/personal-finance/tax/story/new-tax-slabs-for-fy2025-26-how-tax-slabs-will-change-for-new-tax-regime-old-tax-regime-in-new-fiscal-469709-2025-03-27
    old:
      standard_deduction: 50000
      rebate: {limit: 500000, max: 12500}
      slabs: [[250000, 0], [500000, 5], [1000000, 20], [null, 30]]
      source: https://www.indianpaycalculator.in/income-tax-slabs/ay-2024-25
    verified_on: 2026-10-12
  - fy: 2025-26
    new:
      standard_deduction: 75000
      rebate: {limit: 1200000, max: 60000}
      slabs: [[400000, 0], [800000, 5], [1200000, 10], [1600000, 15], [2000000, 20], [2400000, 25], [null, 30]]
      source: https://stableinvestor.com/2025/02/new-regime-tax-slabs-2025.html
    old:
      standard_deduction: 50000
      rebate: {limit: 500000, max: 12500}
      slabs: [[250000, 0], [500000, 5], [1000000, 20], [null, 30]]
      source: https://indianpaycalculator.in/income-tax-slabs
    verified_on: 2026-10-12
  - fy: 2026-27
    new:
      standard_deduction: 75000
      rebate: {limit: 1200000, max: 60000}
      slabs: [[400000, 0], [800000, 5], [1200000, 10], [1600000, 15], [2000000, 20], [2400000, 25], [null, 30]]
      source: https://www.axismaxlife.com/blog/tax-savings/income-tax-slab-2026-27
    old:
      standard_deduction: 50000
      rebate: {limit: 500000, max: 12500}
      slabs: [[250000, 0], [500000, 5], [1000000, 20], [null, 30]]
      source: https://www.axismaxlife.com/blog/tax-savings/income-tax-slab-2026-27
    verified_on: 2026-10-12

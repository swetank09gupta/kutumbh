  - id: sgb.coupon_rate
    value: 2.5
    unit: percent a year on the nominal issue price, paid every six months from the issue date
    effective_from: 2026-10-12
    note: long-standing; earlier dates not verified
    source: https://www.business-standard.com/amp/finance/personal-finance/gold-investors-get-387-returns-as-rbi-redeems-2017-18-sgb-series-126010200299_1.html
    verified_on: 2026-10-12

  # Phase 4: tax lens
    probe: '2\.5 ?(%|per ?cent)'

  - id: cg.holding_months
    value: 12
    unit: months; listed shares, equity funds and listed ETFs are long-term when held for more than this
    effective_from: 2024-07-23
    note: "12 months for all listed securities since the Budget 2024 changes; equity shares and equity funds were already 12 months"
    source: https://zerodha.com/z-connect/business-updates/what-changes-for-investors-after-budget-2024
    verified_on: 2026-10-12
    probe: '12 months'

  - id: cg.listed_other.ltcg_rate
    value: 12.5
    unit: percent, no exemption (listed gold/silver ETFs and other listed units that are not equity-oriented; s.112)
    effective_from: 2024-07-23

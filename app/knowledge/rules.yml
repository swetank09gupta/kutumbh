  - id: rbi.repo_rate
    value: 5.50
    unit: percent
    effective_from: 2026-10-07
    note: first hike since Feb 2023
    source: https://www.scconline.com/blog/post/2026/10/09/rbi-hikes-repo-rate-to-5-50-percent-october-2026/
    verified_on: 2026-10-12

  - id: income_tax.24b_cap
    value: 200000
    unit: INR interest per owner per financial year (self-occupied house, old regime only)
    effective_from: 2014-04-01
    note: each co-owner claims up to the cap on their own share of the interest
    source: https://www.manipalcigna.com/blog/section-24b-of-income-tax-act
    verified_on: 2026-10-12

  # Long-standing rules: no change date was verified, so each starts on the day it was read at its source.
    probe: '2,00,000|2 lakh'

  - id: ppf.interest_cutoff_day
    value: 5
    unit: day of month; interest runs on the lowest balance from this day to month end
    effective_from: 2026-10-12
    note: long-standing; earlier dates not verified
    source: https://www.businesstoday.in/amp/personal-finance/investment/story/ppf-investment-rule-fy27-how-depositing-funds-before-the-5th-every-month-can-maximise-your-returns-524034-2026-04-04
    verified_on: 2026-10-12

  - id: ppf.maturity_years
    value: 15
    unit: financial years, counted from the end of the year the account was opened
    effective_from: 2026-10-12
    note: long-standing; earlier dates not verified
    source: https://www.nsiindia.gov.in/InternalPage.aspx?Id_Pk=55
    verified_on: 2026-10-12
    probe: '15 (complete )?(financial )?years|fifteen'

  - id: elss.lock_in_years
    value: 3
    unit: years, per instalment from its allotment date
    effective_from: 2026-10-12
    note: long-standing; earlier dates not verified
    source: https://cleartax.in/s/elss
    verified_on: 2026-10-12
    probe: '3[- ]year|three[- ]year'

  - id: sgb.tenor_years
    value: 8
    unit: years from issue
    effective_from: 2026-10-12
    note: long-standing; earlier dates not verified
    source: https://www.business-standard.com/amp/finance/personal-finance/gold-investors-get-387-returns-as-rbi-redeems-2017-18-sgb-series-126010200299_1.html
    verified_on: 2026-10-12

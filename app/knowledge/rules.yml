  - id: tds.194.dividend_threshold
    value: 10000
    unit: INR of dividend per company per year (resident individual), TDS above it
    effective_from: 2025-04-01
    note: was 5000 until FY 2024-25
    source: https://taxguru.in/income-tax/budget-2025-dividend-tax-deduction-threshold-rs-10000.html
    verified_on: 2026-10-12
    probe: '10,000'

  - id: tds.194.dividend_rate
    value: 10
    unit: percent
    effective_from: 2026-10-12
    note: long-standing; earlier dates not verified
    source: https://taxguru.in/income-tax/budget-2025-dividend-tax-deduction-threshold-rs-10000.html
    verified_on: 2026-10-12
    probe: '10%|10 per ?cent'

  - id: income_tax.80tta_cap
    value: 10000
    unit: INR of savings-account interest per year (individuals and HUF, not senior citizens; old regime only)
    effective_from: 2012-04-01
    note: applies from AY 2013-14 (income of FY 2012-13)
    source: https://www.incometaxindia.gov.in/w/section-80tta
    verified_on: 2026-10-12
    probe: '10,000'
    probe_url: https://cleartax.in/s/claiming-deduction-on-interest-under-section-80tta

